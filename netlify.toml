# Netlify build configuration.
#
# The Next.js runtime is installed automatically when Netlify detects a Next
# app, so it is deliberately not declared as a plugin here — pinning it by hand
# is the usual way to end up on a runtime older than the framework.

[build]
  # `db:deploy` applies prisma/migrations to the database before the app is
  # built, so a deploy can never ship code that expects a column the database
  # does not have yet. It is a no-op when there is nothing new to apply.
  command = "npm run db:deploy && npm run build"
  publish = ".next"

[build.environment]
  # Netlify's default Node can lag behind the framework. Next 16 needs 20.9+,
  # and prisma.config.ts uses process.loadEnvFile(), which landed in 20.12.
  NODE_VERSION = "22"

# Long-lived immutable assets. Next fingerprints every filename under
# /_next/static, so these can never go stale at the browser.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # The admin panel is the only authenticated surface and it is noindex'd
    # already; these cover the whole site cheaply.
    x-content-type-options = "nosniff"
    referrer-policy = "strict-origin-when-cross-origin"
    x-frame-options = "DENY"

# The admin panel must never be cached or indexed by an intermediary.
[[headers]]
  for = "/admin/*"
  [headers.values]
    cache-control = "private, no-store"
    x-robots-tag = "noindex, nofollow"
